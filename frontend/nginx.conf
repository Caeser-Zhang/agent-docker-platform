server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached, otherwise browsers keep
    # referencing stale hashed assets after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA routing — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 上传粗闸门：nginx 默认 client_max_body_size 只有 1m，任何超过 1MB 的
        # 模板/附件都会在代理层被截成裸 "413 Request Entity Too Large"（HTML 体，
        # 前端拿不到中文 detail）。精确上限由各后端端点自己把（模板入库 25MB、
        # skill 压缩包 50MB 等，超了返回中文 413），这里只需放到比最大端点上限高。
        client_max_body_size 64m;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # OpenViking Studio 反向代理（管理页「记忆访问」Tab 用）。
    # 目的：局域网管理员（如另一台 Windows PC）通过平台已有的 3000 端口访问
    # Studio，不必给 openviking 单独发布 LAN 端口（根 .env 的 OV_BIND 保持
    # 默认 127.0.0.1 即可）。openviking 容器已加入 platform-net，nginx 直连
    # openviking:1933。
    #
    # /studio/  — Studio SPA 本体（OV 自己就挂在该路径下，静态资源均在
    #             /studio/ 前缀内，单 location 即可完整代理）。
    location /studio/ {
        proxy_pass http://openviking:1933/studio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /ovstudio/ — Studio 的 API 数据面：/ovstudio/xxx → OV 的 /xxx。
    #   Studio 登录表单 baseUrl 填 <平台地址>/ovstudio，SPA 即调用同源路径，
    #   无 CORS 问题。鉴权仍是 OpenViking 自己的 key 校验：无 key 一律
    #   401/403，user key 只能由平台管理员在「记忆访问」Tab（admin JWT
    #   鉴权）取得 —— 这就是"仅管理员可看数据"的强制点，nginx 不再加锁。
    location /ovstudio/ {
        proxy_pass http://openviking:1933/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 64m;
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }
}
