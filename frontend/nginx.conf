server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached, otherwise browsers keep
    # referencing stale hashed assets after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA routing — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 上传粗闸门：nginx 默认 client_max_body_size 只有 1m，任何超过 1MB 的
        # 模板/附件都会在代理层被截成裸 "413 Request Entity Too Large"（HTML 体，
        # 前端拿不到中文 detail）。精确上限由各后端端点自己把（模板入库 25MB、
        # skill 压缩包 50MB 等，超了返回中文 413），这里只需放到比最大端点上限高。
        client_max_body_size 64m;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }
}
