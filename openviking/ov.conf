{
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "api_key",
    "root_api_key": "${OV_ROOT_API_KEY}",
    "observability": {
      "metrics": {
        "enabled": true
      }
    }
  },
  "storage": {
    "workspace": "/app/.openviking/data"
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "model": "qwen3.7-text-embedding",
      "api_key": "${OV_EMBEDDING_API_KEY}",
      "api_base": "https://llm-r0umexmtqjpn4tov.cn-beijing.maas.aliyuncs.com/compatible-mode/v1",
      "dimension": 1024,
      "input": "text"
    }
  },
  "vlm": {
    "provider": "openai",
    "model": "glm-5.3-flash",
    "api_key": "${OV_VLM_API_KEY}",
    "api_base": "https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1",
    "temperature": 0.0,
    "max_retries": 2,
    "reasoning_effort": "low"
  },
  "rerank": {
    "api_key": "${OV_RERANK_API_KEY}",
    "api_base": "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank",
    "model": "gte-rerank-v2",
    "threshold": 0.1,
    "timeout": 30.0
  }
}
